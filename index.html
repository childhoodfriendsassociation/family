<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেমেন্ট ও খরচ ম্যানেজমেন্ট সিস্টেম</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --danger: #e71d36;
            --bg: #f8f9fa;
            --text: #2b2d42;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #3a0ca3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>পেমেন্ট ও খরচ এন্ট্রি সিস্টেম</h2>

    <!-- এন্ট্রি ফর্ম -->
    <form id="expenseForm">
        <div class="form-group">
            <label for="date">তারিখ:</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="category">খাত/ক্যাটাগরি:</label>
            <input type="text" id="category" placeholder="যেমন: বাজার, বিল ইত্যাদি" required>
        </div>
        <div class="form-group">
            <label for="amount">টাকার পরিমাণ:</label>
            <input type="number" id="amount" placeholder="0.00" required>
        </div>
        <div class="form-group">
            <label for="year">বছর:</label>
            <input type="text" id="year" placeholder="যেমন: 2026" required>
        </div>
        <div class="form-group">
            <label for="month">মাস (সংখ্যা বা নাম):</label>
            <input type="text" id="month" placeholder="যেমন: 9 বা September" required>
        </div>
        <button type="submit" id="submitBtn">ডাটা সেভ করুন</button>
    </form>

    <!-- ডাটা টেবিল -->
    <h3>লেনদেনের তালিকা</h3>
    <table>
        <thead>
            <tr>
                <th>তারিখ</th>
                <th>ক্যাটাগরি</th>
                <th>পরিমাণ</th>
                <th>বছর/মাস</th>
            </tr>
        </thead>
        <tbody id="expenseTableBody">
            <tr>
                <td colspan="4" class="empty-state">ডাটা লোড হচ্ছে...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // আপনার নতুন গুগলের Apps Script Web App URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxSD7cUsHfGwDkpzqawJ9Fk4ltQ0dennxJlHV06mIKEadsYfL6mD8CoU8FiuBecDISP/exec';
    
    let allTransactions = [];

    // সাইটে ঢোকার সাথেই সাথে (Page Load) ডাটা ফেচ করার জন্য
    window.addEventListener('DOMContentLoaded', () => {
        // আজকের তারিখ স্বয়ংক্রিয়ভাবে ইনপুটে বসিয়ে দেওয়া
        document.getElementById('date').valueAsDate = new Date();
        
        // অটো বছর ও মাস সিলেক্ট করা
        const today = new Date();
        document.getElementById('year').value = today.getFullYear();
        document.getElementById('month').value = today.getMonth() + 1;

        // গুগল শিট থেকে লেটেস্ট ডাটা টেনে আনা
        fetchTransactions();
    });

    // গুগল শিট থেকে ডাটা লোড করার নিরাপদ ফাংশন (ক্যাশ এড়াতে টাইমস্ট্যাম্পসহ)
    function fetchTransactions() {
        const noCacheURL = scriptURL + '?t=' + new Date().getTime();

        fetch(noCacheURL, {
            method: 'GET',
            redirect: 'follow' 
        })
        .then(response => response.json())
        .then(data => {
            if(Array.isArray(data)) {
                allTransactions = data.map(item => {
                    let itemDate = new Date(item.date);
                    return {
                        date: item.date,
                        category: item.category,
                        amount: Number(item.amount),
                        year: item.year ? item.year.toString() : itemDate.getFullYear().toString(),
                        month: (item.month !== undefined && item.month !== "") ? item.month.toString() : itemDate.getMonth().toString()
                    };
                });
            }
            updateUIAfterFetch();
        })
        .catch(error => {
            console.error('Fetch Error:', error);
            document.getElementById('expenseTableBody').innerHTML = `
                <tr><td colspan="4"><div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i><p>গুগল শিট থেকে ডেটা লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে পেজটি রিফ্রেশ করুন।</p></div></td></tr>
            `;
        });
    }

    // টেবিল আপডেট করার ফাংশন
    function updateUIAfterFetch() {
        const tbody = document.getElementById('expenseTableBody');
        tbody.innerHTML = '';

        if(allTransactions.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-state">কোনো ডাটা পাওয়া যায়নি।</td></tr>`;
            return;
        }

        // নিচ থেকে ওপর বা লেটেস্ট ডাটা আগে দেখানোর জন্য রিভার্স করা যেতে পারে
        allTransactions.slice().reverse().forEach(item => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.date ? new Date(item.date).toLocaleDateString() : ''}</td>
                <td>${item.category || ''}</td>
                <td>৳${item.amount || 0}</td>
                <td>${item.year || ''} / ${item.month || ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ফর্ম সাবমিট করে নতুন ডাটা গুগল শিটে পাঠানোর হ্যান্ডেলার
    const form = document.getElementById('expenseForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'সেভ হচ্ছে...';

        const payload = {
            action: 'addExpense',
            date: document.getElementById('date').value,
            category: document.getElementById('category').value,
            amount: document.getElementById('amount').value,
            year: document.getElementById('year').value,
            month: document.getElementById('month').value
        };

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        })
        .then(response => response.json())
        .then(result => {
            alert('সফলভাবে ডাটা সেভ হয়েছে!');
            form.reset();
            // বর্তমান তারিখ ও বছর পুনরায় সেট করা
            document.getElementById('date').valueAsDate = new Date();
            const today = new Date();
            document.getElementById('year').value = today.getFullYear();
            document.getElementById('month').value = today.getMonth() + 1;
            
            submitBtn.disabled = false;
            submitBtn.innerText = 'ডাটা সেভ করুন';
            
            // ডাটা সেভ হওয়ার সাথে সাথে শিট থেকে আবার লেটেস্ট ডাটা রিফ্রেশ করে নেওয়া
            fetchTransactions();
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('সংরক্ষণ করতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।');
            submitBtn.disabled = false;
            submitBtn.innerText = 'ডাটা সেভ করুন';
        });
    });
</script>

</body>
</html>
